<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoneyForge · События безопасности</title>
  <link rel="stylesheet" href="/app.css?v=20261016-2" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">HoneyForge</a>
    <nav aria-label="Центр управления">
      <a href="/index.html">Обзор</a>
      <a href="/events.html" aria-current="page">События безопасности</a>
      <a href="/traps.html">Ловушки</a>
      <a href="/profiles.html">Профили ловушек</a>
      <details class="operator-menu">
        <summary><span class="operator" id="operator">Проверка оператора…</span></summary>
        <div class="operator-dropdown">
          <button class="button quiet" id="logout" type="button">Выйти</button>
        </div>
      </details>
    </nav>
  </header>
  <main class="events-shell">
    <header class="events-heading reveal">
            <p class="eyebrow">Наблюдаемая активность</p>
      <h1>События безопасности</h1>
      <p>События, полученные от развёрнутых ловушек.</p>
    </header>
    <form class="event-filters" id="event-filters" action="/events.html" method="get">
      <label>ID ловушки<input name="trap_id" type="text" autocomplete="off" /></label>
      <label>ID сессии атаки<input name="attack_session_id" type="text" autocomplete="off" /></label>
      <label>Тип события
        <select name="event_type">
          <option value="">Все типы событий</option>
          <option value="connection_opened">Соединение открыто</option>
          <option value="authentication_attempt">Попытка аутентификации</option>
          <option value="command_entered">Введена команда</option>
          <option value="http_request">HTTP-запрос</option>
          <option value="connection_closed">Соединение закрыто</option>
        </select>
      </label>
      <label>IP источника <input name="source_ip" type="text" autocomplete="off" placeholder="192.0.2.44 или 2001:db8::1" /></label>
      <fieldset class="datetime-filter" aria-label="Начало периода">
        <div class="datetime-inputs">
          <label>Дата<input name="received_from_date" type="date" /></label>
          <label>Время<input name="received_from_time" type="time" step="1" /></label>
        </div>
      </fieldset>
      <fieldset class="datetime-filter" aria-label="Конец периода">
        <div class="datetime-inputs">
          <label>Дата<input name="received_to_date" type="date" /></label>
          <label>Время<input name="received_to_time" type="time" step="1" /></label>
        </div>
      </fieldset>
      <div class="filter-actions">
        <button class="button" type="submit">Применить фильтры</button>
        <a class="button quiet" href="/events.html">Сбросить</a>
      </div>
    </form>
    <div class="event-columns" aria-hidden="true">
      <span>Время</span>
      <span>Событие / ловушка</span>
      <span>Источник → сервис / сессия атаки</span>
      <span>Данные (JSON)</span>
    </div>
    <ol class="event-stream" id="event-stream" aria-live="polite"></ol>
    <p class="empty-events" id="empty-events">События безопасности отсутствуют.</p>
  </main>
  <script src="/events.js" defer></script>
  <script>
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' });
      window.location.replace('/login.html');
    });
  </script>
  <script type="module" src="/header.js"></script>
</body>
</html>
