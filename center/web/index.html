<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoneyForge · Control Center</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">HoneyForge</a>
    <nav aria-label="Control Center">
      <a href="/profiles.html">Trap Profiles</a>
      <span class="operator" id="operator">Checking Operator…</span>
      <button class="button quiet" id="logout" type="button">Log out</button>
    </nav>
  </header>
  <main class="dashboard">
    <h1 class="reveal">Shape the trap before it meets the network.</h1>
    <p class="lead reveal">Define reusable service behavior once, version every change, and keep the history needed to understand what each Trap presented.</p>
    <a class="button primary-link reveal" href="/profiles.html">Manage Trap Profiles</a>
  </main>
  <script>
    fetch('/api/v1/dashboard', { credentials: 'same-origin' })
      .then(r => {
        if (r.status === 401) window.location.replace('/login.html');
        if (!r.ok) throw new Error('dashboard unavailable');
        return r.json();
      })
      .then(d => { document.getElementById('operator').textContent = 'Operator: ' + d.operator; })
      .catch(() => { document.getElementById('operator').textContent = 'Dashboard unavailable'; });

    document.getElementById('logout').addEventListener('click', () => {
      fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' })
        .then(() => window.location.replace('/login.html'));
    });
  </script>
</body>
</html>
