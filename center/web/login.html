<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoneyForge · Вход оператора</title>
  <link rel="stylesheet" href="/app.css?v=20261016-2" />

</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-head">
        <p class="eyebrow">Центр управления</p>
        <h1 id="login-title">HoneyForge</h1>
      </header>
      <form class="login-form" id="login-form">
        <p class="login-hint">Войдите, чтобы управлять ловушками и их профилями.</p>
        <label class="field">
          <span>Оператор</span>
          <input name="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Пароль</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="button login-submit" type="submit">Войти</button>
        <p class="notice error" id="error" role="alert"></p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const values = new FormData(event.currentTarget);
      const response = await fetch('/api/v1/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: values.get('username'), password: values.get('password') })
      });
      if (response.ok) window.location.replace('/');
      else document.getElementById('error').textContent = 'Неверное имя оператора или пароль.';
    });
  </script>
</body>
</html>
