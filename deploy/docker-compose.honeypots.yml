# Honeypot fleet: relay-a and relay-b on a separated DMZ host.
# The local demo adds docker-compose.demo.yml for host-gateway resolution.
name: relay-services

x-agent-common: &agent-common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  user: syslog-relay
  group_add:
    - ${HOST_SECRET_GID:-1000}
  networks:
    - relay_egress_net
    - service_net

services:
  relay-a:
    <<: *agent-common
    build:
      context: ..
      dockerfile: agent/low/Dockerfile
    image: local/syslog-relay-a:dev
    container_name: syslog-relay-a
    networks:
      relay_egress_net:
        priority: 100
      service_net:
        ipv4_address: 172.31.0.11
        priority: 1000
    environment:
      CENTER_URL: ${AGENT_CENTER_URL:-https://assets.cdn-static.example}
      SERVICE_KEY_FILE: /run/secrets/relay.key
      CENTER_CA_FILE: /etc/syslog-relay/center-ca.crt
      EVENT_QUEUE_PATH: /var/lib/syslog-relay/events.sqlite3
      EVENT_QUEUE_MAX_EVENTS: ${EVENT_QUEUE_MAX_EVENTS:-100000}
      EVENT_QUEUE_MAX_BYTES: ${EVENT_QUEUE_MAX_BYTES:-268435456}
      HEALTH_INTERVAL_SECONDS: ${HEALTH_INTERVAL_SECONDS:-30}
      PROFILE_CHECK_INTERVAL_SECONDS: ${PROFILE_CHECK_INTERVAL_SECONDS:-30}
      DELIVERY_INTERVAL_SECONDS: ${DELIVERY_INTERVAL_SECONDS:-1}
      SERVICE_VERSION: ${AGENT_VERSION:-0.1.0}
      LISTEN_HOST: 172.31.0.11
      TELEMETRY_PATH: ${TELEMETRY_PATH:-/assets/v2/init}
      PROCESS_MASK_NAME: ${PROCESS_MASK_NAME:-syslog-relay}
      # Beacon cadence is not an environment setting: the Agent reads
      # beacon_interval_seconds / beacon_jitter_seconds from its Trap Profile.
    secrets:
      - source: relay_a_key
        target: relay.key
        mode: 0444
    volumes:
      - ${CENTER_CA_CERT_FILE:-./nginx/certs/ca.crt}:/etc/syslog-relay/center-ca.crt:ro
      - relay_a_data:/var/lib/syslog-relay
    ports:
      - "${LOW_SSH_PORT:-2222}:${LOW_SSH_INTERNAL_PORT:-22}"
      - "${LOW_HTTP_PORT:-8080}:${LOW_HTTP_INTERNAL_PORT:-80}"
      - "${LOW_MYSQL_PORT:-33060}:${LOW_MYSQL_INTERNAL_PORT:-3306}"
      - "${LOW_UDP_PORT:-9999}:${LOW_UDP_INTERNAL_PORT:-9999}/udp"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  relay-b:
    <<: *agent-common
    build:
      context: ..
      dockerfile: agent/medium/Dockerfile
    image: local/syslog-relay-b:dev
    container_name: syslog-relay-b
    networks:
      relay_egress_net:
        priority: 100
      service_net:
        ipv4_address: 172.31.0.12
        priority: 1000
    environment:
      CENTER_URL: ${AGENT_CENTER_URL:-https://assets.cdn-static.example}
      SERVICE_KEY_FILE: /run/secrets/relay.key
      CENTER_CA_FILE: /etc/syslog-relay/center-ca.crt
      EVENT_QUEUE_PATH: /var/lib/syslog-relay/events.sqlite3
      EVENT_QUEUE_MAX_EVENTS: ${EVENT_QUEUE_MAX_EVENTS:-100000}
      EVENT_QUEUE_MAX_BYTES: ${EVENT_QUEUE_MAX_BYTES:-268435456}
      HEALTH_INTERVAL_SECONDS: ${HEALTH_INTERVAL_SECONDS:-30}
      PROFILE_CHECK_INTERVAL_SECONDS: ${PROFILE_CHECK_INTERVAL_SECONDS:-30}
      DELIVERY_INTERVAL_SECONDS: ${DELIVERY_INTERVAL_SECONDS:-1}
      LISTEN_HOST: 172.31.0.12
      PROCESS_MASK_NAME: ${PROCESS_MASK_NAME:-syslog-relay}
    secrets:
      - source: relay_b_key
        target: relay.key
        mode: 0444
    volumes:
      - ${CENTER_CA_CERT_FILE:-./nginx/certs/ca.crt}:/etc/syslog-relay/center-ca.crt:ro
      - relay_b_data:/var/lib/syslog-relay
    ports:
      - "${MEDIUM_SSH_PORT:-2223}:${MEDIUM_SSH_INTERNAL_PORT:-22}"
      - "${MEDIUM_HTTP_PORT:-8081}:${MEDIUM_HTTP_INTERNAL_PORT:-80}"
      - "${MEDIUM_MYSQL_PORT:-33061}:${MEDIUM_MYSQL_INTERNAL_PORT:-3306}"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

networks:
  relay_egress_net:
    name: relay_egress_net
    driver: bridge
    ipam:
      # Pinned so an auto-assigned subnet can never swallow relay_service_net.
      config:
        - subnet: 172.29.0.0/24
  service_net:
    name: relay_service_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  relay_a_data:
    name: ${RELAY_A_DATA_VOLUME:-relay_a_data}
  relay_b_data:
    name: ${RELAY_B_DATA_VOLUME:-relay_b_data}

secrets:
  relay_a_key:
    file: ${LOW_TRAP_SECRET_FILE:-./secrets/low_trap_secret}
  relay_b_key:
    file: ${MEDIUM_TRAP_SECRET_FILE:-./secrets/medium_trap_secret}
