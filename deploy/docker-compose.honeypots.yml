# Honeypot fleet: agent-low and agent-medium on a separated DMZ host.
# The local demo adds docker-compose.demo.yml for host-gateway resolution.
name: honeyforge-honeypots

x-agent-common: &agent-common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  user: honeyforge-agent
  group_add:
    - ${HOST_SECRET_GID:-1000}
  networks:
    - agent_egress_net
    - honeypot_exposed

services:
  agent-low:
    <<: *agent-common
    build:
      context: ..
      dockerfile: agent/low/Dockerfile
    image: honeyforge/agent-low:dev
    container_name: hf-agent-low
    networks:
      agent_egress_net:
        priority: 100
      honeypot_exposed:
        ipv4_address: 172.31.0.11
        priority: 1000
    environment:
      CENTER_URL: ${AGENT_CENTER_URL:-https://assets.cdn-static.example}
      TRAP_SECRET_FILE: /run/secrets/trap_secret
      CENTER_CA_FILE: /etc/honeyforge/center-ca.crt
      EVENT_QUEUE_PATH: /var/lib/honeyforge/events.sqlite3
      EVENT_QUEUE_MAX_EVENTS: ${EVENT_QUEUE_MAX_EVENTS:-100000}
      EVENT_QUEUE_MAX_BYTES: ${EVENT_QUEUE_MAX_BYTES:-268435456}
      HEALTH_INTERVAL_SECONDS: ${HEALTH_INTERVAL_SECONDS:-30}
      PROFILE_CHECK_INTERVAL_SECONDS: ${PROFILE_CHECK_INTERVAL_SECONDS:-30}
      DELIVERY_INTERVAL_SECONDS: ${DELIVERY_INTERVAL_SECONDS:-1}
      AGENT_VERSION: ${AGENT_VERSION:-0.1.0}
      HONEYPOT_ID: ${HONEYPOT_ID_LOW:-low-01}
      HONEYPOT_LEVEL: low
      LISTEN_HOST: 172.31.0.11
      TELEMETRY_PATH: ${TELEMETRY_PATH:-/assets/v2/init}
      BEACON_INTERVAL_SECONDS: ${BEACON_INTERVAL_SECONDS:-60}
      BEACON_JITTER_SECONDS: ${BEACON_JITTER_SECONDS:-30}
    secrets:
      - source: low_trap_secret
        target: trap_secret
        mode: 0444
    volumes:
      - ${CENTER_CA_CERT_FILE:-./nginx/certs/ca.crt}:/etc/honeyforge/center-ca.crt:ro
      - agent_low_data:/var/lib/honeyforge
    ports:
      - "${LOW_SSH_PORT:-2222}:${LOW_SSH_INTERNAL_PORT:-22}"
      - "${LOW_HTTP_PORT:-8080}:${LOW_HTTP_INTERNAL_PORT:-80}"
      - "${LOW_MYSQL_PORT:-33060}:${LOW_MYSQL_INTERNAL_PORT:-3306}"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  agent-medium:
    <<: *agent-common
    build:
      context: ..
      dockerfile: agent/medium/Dockerfile
    image: honeyforge/agent-medium:dev
    container_name: hf-agent-medium
    networks:
      agent_egress_net:
        priority: 100
      honeypot_exposed:
        ipv4_address: 172.31.0.12
        priority: 1000
    environment:
      CENTER_URL: ${AGENT_CENTER_URL:-https://assets.cdn-static.example}
      TRAP_SECRET_FILE: /run/secrets/medium_trap_secret
      CENTER_CA_FILE: /etc/honeyforge/center-ca.crt
      EVENT_QUEUE_PATH: /var/lib/honeyforge/events.sqlite3
      EVENT_QUEUE_MAX_EVENTS: ${EVENT_QUEUE_MAX_EVENTS:-100000}
      EVENT_QUEUE_MAX_BYTES: ${EVENT_QUEUE_MAX_BYTES:-268435456}
      HEALTH_INTERVAL_SECONDS: ${HEALTH_INTERVAL_SECONDS:-30}
      PROFILE_CHECK_INTERVAL_SECONDS: ${PROFILE_CHECK_INTERVAL_SECONDS:-30}
      DELIVERY_INTERVAL_SECONDS: ${DELIVERY_INTERVAL_SECONDS:-1}
      HONEYPOT_ID: ${HONEYPOT_ID_MEDIUM:-medium-01}
      HONEYPOT_LEVEL: medium
      LISTEN_HOST: 172.31.0.12
    secrets:
      - source: medium_trap_secret
        target: medium_trap_secret
        mode: 0444
    volumes:
      - ${CENTER_CA_CERT_FILE:-./nginx/certs/ca.crt}:/etc/honeyforge/center-ca.crt:ro
      - medium_agent_data:/var/lib/honeyforge
    ports:
      - "${MEDIUM_SSH_PORT:-2223}:${MEDIUM_SSH_INTERNAL_PORT:-22}"
      - "${MEDIUM_HTTP_PORT:-8081}:${MEDIUM_HTTP_INTERNAL_PORT:-80}"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

networks:
  agent_egress_net:
    name: honeyforge_agent_egress_net
    driver: bridge
  honeypot_exposed:
    name: honeyforge_honeypot_exposed
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  agent_low_data:
  medium_agent_data:

secrets:
  low_trap_secret:
    file: ${LOW_TRAP_SECRET_FILE:-./secrets/low_trap_secret}
  medium_trap_secret:
    file: ${MEDIUM_TRAP_SECRET_FILE:-./secrets/medium_trap_secret}
