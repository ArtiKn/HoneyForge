# Center stack: postgres, api, collector, web, nginx (task 6.1).
# mgmt_net is internal (task 4.3); edge_net only publishes Nginx ports.
name: honeyforge-center

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *default-logging

services:
  postgres:
    <<: *hardening
    image: postgres:16
    container_name: hf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honeyforge}
      POSTGRES_DB: ${POSTGRES_DB:-honeyforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - mgmt_net
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api:
    <<: *hardening
    build:
      context: ..
      dockerfile: center/api/Dockerfile
    image: honeyforge/api:dev
    container_name: hf-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?OPERATOR_PASSWORD is required}
      OPERATOR_ROLE: ${OPERATOR_ROLE:-admin}
      OPERATOR_VIEWER_USERNAME: ${OPERATOR_VIEWER_USERNAME:-}
      OPERATOR_VIEWER_PASSWORD: ${OPERATOR_VIEWER_PASSWORD:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      TELEMETRY_PATH: ${TELEMETRY_PATH:-/assets/v2/init}
      ENROLLMENT_TOKEN_MINUTES: ${ENROLLMENT_TOKEN_MINUTES:-10}
      TRAP_SECRET_OVERLAP_MINUTES: ${TRAP_SECRET_OVERLAP_MINUTES:-5}
      HEALTH_TIMEOUT_SECONDS: ${HEALTH_TIMEOUT_SECONDS:-90}
      HEALTH_SWEEP_INTERVAL_SECONDS: ${HEALTH_SWEEP_INTERVAL_SECONDS:-30}
      SECURITY_DATA_RETENTION_DAYS: ${SECURITY_DATA_RETENTION_DAYS:-30}
      AUDIT_ENTRY_RETENTION_DAYS: ${AUDIT_ENTRY_RETENTION_DAYS:-365}
      RETENTION_SWEEP_INTERVAL_SECONDS: ${RETENTION_SWEEP_INTERVAL_SECONDS:-86400}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.30.0.10}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mgmt_net
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  collector:
    <<: *hardening
    build:
      context: ..
      dockerfile: center/collector/Dockerfile
    image: honeyforge/collector:dev
    container_name: hf-collector
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mgmt_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  web:
    <<: *hardening
    build:
      context: ../center/web
    image: honeyforge/web:dev
    container_name: hf-web
    networks:
      - mgmt_net
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    entrypoint: ["nginx", "-g", "daemon off;"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    container_name: hf-nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${CENTER_HTTP_PORT:-80}:80"
      - "${CENTER_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${CENTER_TLS_CERT_FILE:-./nginx/certs/center.crt}:/etc/nginx/certs/center.crt:ro
      - ${CENTER_TLS_KEY_FILE:-./nginx/certs/center.key}:/etc/nginx/certs/center.key:ro
    networks:
      mgmt_net:
        ipv4_address: 172.30.0.10
      edge_net: {}
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    entrypoint: ["nginx", "-g", "daemon off;"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  mgmt_net:
    name: honeyforge_mgmt_net
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  edge_net:
    name: honeyforge_edge_net
    driver: bridge

volumes:
  pgdata:
    name: honeyforge_pgdata
