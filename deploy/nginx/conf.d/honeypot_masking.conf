# Masked telemetry endpoint: /assets/v2/init -> api (task 4.2, MASK-2).
# Served under a CDN-like server_name so it is not next to the UI or API.
# Check: curl -k --resolve assets.cdn-static.example:443:127.0.0.1 \
#        -X POST https://assets.cdn-static.example/assets/v2/init -d "{}"

server {
    listen 443 ssl;
    http2 on;
    server_name assets.cdn-static.example;

    ssl_certificate     /etc/nginx/certs/center.crt;
    ssl_certificate_key /etc/nginx/certs/center.key;

    server_tokens off;

    location /assets/v2/init {
        proxy_pass http://api:8000/assets/v2/init;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        return 404;
    }

    location / {
        return 404;
    }
}
